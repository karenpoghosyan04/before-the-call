[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-marketing-study"
version = "0.1.0"
description = "A reproducible, pre-call tabular classification study"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.9.0", "scikit-learn==1.7.2", "pandas==2.3.3",
  "matplotlib==3.10.7", "numpy==2.3.4", "joblib==1.5.2",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
bank-study = "bankstudy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

